<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Świąteczne losowanie</title>
    <link rel="icon" type="image/x-icon" href="./img/santa-claus.png">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-T3c6CoIi6uLrA9TneNEoa7RxnatzjcDSCmG1MXxSR1GAsXEV/Dwwykc2MPK8M2HN" crossorigin="anonymous">
    <link rel="stylesheet" type="text/css" href="./styles.css">
</head>
<body>
  <script type="module" src="./app.js"></script>

  <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.11.8/dist/umd/popper.min.js" integrity="sha384-I7E8VVD/ismYTF4hNIPjVp/Zjvgyol6VFvRkX/vR+Vc4jQkC+hVqc2pM8ODewa9r" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.min.js" integrity="sha384-BBtl+eGJRgqQAUMxJ7pMwbEyER4l1g+O15P+16Ep7Q9Q+zqX6gSbd85u4mG4QzX+" crossorigin="anonymous"></script>

  <div id="container">
    <h2>Świąteczne losowanie</h2>

    <form action="" id="drawing-form">
      <h5>Kto losuje?</h5>
      <select class="form-select" id="person-list">
        <option value=""></option>
      </select>

      <p>
        <em>
          Po kliknięciu "Losuj" pojawi się <strong>okienko</strong>, w którym <strong>wyświetli się wylosowana osoba</strong>.
          <br>
          <strong>Zapamiętaj</strong> ją lub <strong>zapisz</strong>, bo nie będzie można jej wyświetlić drugi raz!
        </em>
      </p>

      <button type="submit" class="btn btn-primary">Losuj</button>
    </form>
  </div>

</body>
</html>
